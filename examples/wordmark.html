<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyphmotion: wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #070b18; color: #dfe9f1; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  body { display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .mark { width: min(900px, 100%); aspect-ratio: 3 / 1; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  p { text-align: center; color: #8293a9; margin: 12px 0 0; }
  button { font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace; color: #dfe9f1; background: transparent; border: 1px solid rgba(130,160,190,.3); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #ffb15c; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark"><canvas id="c" role="img" aria-label="The word Glyphmotion, assembled from drifting glowing characters."></canvas></div>
  <p>Each letter cell is a particle with a home. Move through it to scatter, then watch it settle. <button id="again" type="button">form again</button></p>
</main>
<script src="../src/glyphmotion.js"></script>
<script>
const { Pool, textMask, rnd, hash2, ramp, clamp, lerp } = Glyphmotion;
let P = null;
const GLYPHS = '#%@&#@';

function form(s, scatter) {
  for (let i = 0; i < P.n; i++) {
    if (scatter) { P.x[i] = rnd(-10, s.W + 10); P.y[i] = rnd(-10, s.H + 10); }
    P.delay[i] = (P.hx[i] / s.W) * 0.9 + rnd(0, 0.25);
  }
}

const s = Glyphmotion.surface(document.getElementById('c'), {
  fontSize: (w) => Math.max(5, Math.min(10, w / 115)), bloom: 0.6,
  setup(s) {
    const mask = textMask(s, 'glyphmotion', { font: '400 100px "Archivo Black", Impact, "Arial Black", sans-serif', fill: 0.92 });
    let n = 0; for (let i = 0; i < mask.length; i++) n += mask[i];
    P = new Pool(n, ['x', 'y', 'vx', 'vy', 'hx', 'hy', 'delay', 'seed']);
    for (let i = 0; i < mask.length; i++) if (mask[i]) {
      const c = i % s.cols, r = (i / s.cols) | 0;
      P.spawn({ hx: c + 0.5, hy: (r + 0.5) * s.asp, seed: hash2(c, r) });
    }
    form(s, true);
  },
  still(s) { for (let i = 0; i < P.n; i++) { P.x[i] = P.hx[i]; P.y[i] = P.hy[i]; } },
  step(s, dt) {
    const p = s.pointer;
    for (let i = 0; i < P.n; i++) {
      if (P.delay[i] > 0) { P.delay[i] -= dt; continue; }
      // spring home, with a little swirl so it arrives like a flock, not a slide
      let ax = (P.hx[i] - P.x[i]) * 18, ay = (P.hy[i] - P.y[i]) * 18;
      ax += -(P.y[i] - P.hy[i]) * 6; ay += (P.x[i] - P.hx[i]) * 6;
      if (p.inside) {
        const dx = P.x[i] - p.x, dy = P.y[i] - p.y, d2 = dx * dx + dy * dy;
        if (d2 < 90) { const f = (90 - d2) * 9 / (Math.sqrt(d2) + 0.5); ax += dx * f; ay += dy * f; }
      }
      P.vx[i] = (P.vx[i] + ax * dt) * (1 - 6.5 * dt);
      P.vy[i] = (P.vy[i] + ay * dt) * (1 - 6.5 * dt);
      P.x[i] += P.vx[i] * dt; P.y[i] += P.vy[i] * dt;
    }
  },
  draw(s) {
    s.clear();
    const t = s.time, sweep = ((t * 0.35) % 1.6 - 0.3) * s.W;
    for (let i = 0; i < P.n; i++) {
      const off = Math.hypot(P.x[i] - P.hx[i], P.y[i] - P.hy[i]);
      const settled = clamp(1 - off / 6, 0, 1);
      const glint = Math.exp(-Math.pow((P.hx[i] - sweep) / 4, 2)) * settled;
      const ch = settled > 0.9 ? GLYPHS[(P.seed[i] * 4 + (glint > 0.4 ? 2 : 0)) | 0] : ramp(0.3 + settled * 0.5, '.:-=+*');
      const warm = P.hy[i] / s.H;
      s.putW(P.x[i], P.y[i], ch,
        lerp(lerp(90, 255, warm), 255, glint), lerp(lerp(190, 170, warm), 245, glint), lerp(lerp(230, 110, warm), 220, glint));
    }
  }
});

// the wordmark face may arrive after the grid font; re-rasterize once it does
if (document.fonts && document.fonts.load) document.fonts.load('400 100px "Archivo Black"').then(() => s.layout());

document.getElementById('again').addEventListener('click', () => {
  form(s, true);
  if (Glyphmotion.reducedMotion) { s.o.still(s); s.invalidate(); }
});
</script>
</body>
</html>
